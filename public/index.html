<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Stick Figure Game</title>
		<style>
			* {
				box-sizing: border-box;
			}
			html, body {
				margin: 0;
				padding: 0;

				font: 16px "Helvetica Neue", Helvetica, Arial, sans-serif;
				color: #444;
				background-color: #fff;
			}
			body {
				width: 70%;
				margin: 50px auto 0;

				text-align: center;
			}
			.desc {
				font-weight: bold;
			}
			.bookmarklet {
				display: inline-block;
				margin: 5px 0 12px;
				padding: 10px 15px;
				vertical-align: middle;

				color: #ffffff;
				background-color: #4CAF50;
				box-shadow: 0 7px 0 #388E3C;
				border-radius: 4px;
				text-decoration: none;
				font-weight: bold;
				cursor: move;
			}
			@media (max-width: 768px) {
				body {
					margin-top: 0;
					width: 100%;
					padding: 0 10px;
				}
			}
		</style>
	</head>
	<body>
		<p class="desc">
			Drag this into to your bookmarks bar:
		</p>
		<div>
			<a id="bm"
				href="javascript:(function(d,u,i,v,s){if(!d.getElementById(i)){s=d.createElement('script');s.id=i;d.body.appendChild(s);s.src=u+'?v='+v}})(document,'https://jonathan-scholz.de/bm/game.js','bm-script',1)"
				class="bookmarklet"
				onclick="return false">
					Stick Figure Game
			</a>
		</div>
		<p>
			You can play now by clicking the bookmark.
		</p>
	</body>
</html>
